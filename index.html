    <script>
      (function() {
        // 1. Filter console.error and console.warn for Vite HMR WebSocket benign messages
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { 
            return (a && (a.message || a.stack || (typeof a === 'object' ? JSON.stringify(a) : a))) || ''; 
          }).join(' ');
          if (
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('vite-hmr') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) { 
            return (a && (a.message || a.stack || (typeof a === 'object' ? JSON.stringify(a) : a))) || ''; 
          }).join(' ');
          if (
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1
          ) {
            return;
          }
          return origConsoleWarn.apply(console, arguments);
        };

        // 2. Global error & rejection filters
        window.addEventListener('error', function (e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (typeof msg === 'string' && (
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1
          )) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e ? (e.reason && (e.reason.message || e.reason.stack || e.reason)) || '' : '';
          var reasonStr = String(reason);
          if (
            reasonStr.indexOf('[vite]') !== -1 ||
            reasonStr.indexOf('WebSocket') !== -1 ||
            reasonStr.indexOf('websocket') !== -1 ||
            reasonStr.indexOf('closed without opened') !== -1
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        // 3. Mock Vite HMR WebSocket so it stays completely silent without throwing
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (
              (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/client') !== -1))
            ) {
              var target = new EventTarget();
              target.readyState = 3; // CLOSED
              target.close = function() {};
              target.send = function() {};
              target.addEventListener = EventTarget.prototype.addEventListener.bind(target);
              target.removeEventListener = EventTarget.prototype.removeEventListener.bind(target);
              target.dispatchEvent = EventTarget.prototype.dispatchEvent.bind(target);
              return target;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }
      })();
    </script>
